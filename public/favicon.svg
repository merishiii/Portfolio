<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd8f8;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#4ab8e8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#1a6fa8;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2535;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1520;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Left chevron < -->
  <g filter="url(#glow)">
    <!-- Outer stroke/glow layer -->
    <path d="M 168 140 L 78 256 L 168 372" 
          fill="none" 
          stroke="url(#gloss)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Inner dark fill -->
    <path d="M 168 140 L 78 256 L 168 372" 
          fill="none" 
          stroke="url(#inner)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Top cyan highlight -->
    <path d="M 168 140 L 78 256 L 168 372" 
          fill="none" 
          stroke="#a0eaff" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>

  <!-- Right chevron > -->
  <g filter="url(#glow)">
    <path d="M 344 140 L 434 256 L 344 372" 
          fill="none" 
          stroke="url(#gloss)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 344 140 L 434 256 L 344 372" 
          fill="none" 
          stroke="url(#inner)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 344 140 L 434 256 L 344 372" 
          fill="none" 
          stroke="#a0eaff" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>

  <!-- Slash / -->
  <g filter="url(#glow)">
    <rect x="237" y="120" width="38" height="272" rx="19"
          fill="url(#gloss)"/>
    <rect x="245" y="120" width="22" height="272" rx="11"
          fill="url(#inner)"/>
    <rect x="245" y="120" width="5" height="272" rx="2.5"
          fill="#a0eaff" opacity="0.5"/>
  </g>
</svg>